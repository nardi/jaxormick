site_name: JAXormick
site_description: McCormick relaxations of JAX functions
repo_url: https://github.com/nardi/jaxormick
repo_name: nardi/jaxormick

theme:
  name: material
  features:
    - navigation.sections
    - navigation.top
    - content.code.copy
    - search.suggest
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode

plugins:
  - search
  - mkdocstrings:
      handlers:
        python:
          options:
            docstring_style: null
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            heading_level: 2
            members_order: source
            merge_init_into_class: true
            separate_signature: true
            show_signature_annotations: true

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.arithmatex:
      generic: true
  - toc:
      permalink: true

extra_javascript:
  - javascripts/mathjax.js
  - https://cdn.jsdelivr.net/npm/mathjax@3.2.2/es5/tex-mml-chtml.js

nav:
  - Home: index.md
  - Theory:
      - Convex relaxations: theory/relaxations.md
      - McCormick relaxations: theory/mccormick.md
      - Relaxations in JAX: theory/jax.md
      - References: theory/references.md
  - User guide:
      - Basic usage: guide/basic.md
      - Affine relaxations: guide/affine.md
      - Tighter relaxations: guide/tightening.md
      - Parameters and batches: guide/parameters.md
      - Control flow: guide/control_flow.md
      - Supported operations: guide/supported.md
      - Performance: guide/performance.md
      - Custom rules: guide/extending.md
  - API reference:
      - Transformations: api/transforms.md
      - Relaxations: api/relaxation.md
      - Rules: api/rules.md
